<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>miu. — Redirecting...</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages and static hosts
      // Handles both custom domain and project repo (username.github.io/repo)
      var l = window.location;
      var isProjectGitHubPages = Boolean(
        l.hostname.endsWith('github.io') &&
        l.pathname.split('/').filter(Boolean).length > 0 &&
        !l.hostname.startsWith(l.pathname.split('/')[1] + '.')
      );
      var pathSegmentsToKeep = isProjectGitHubPages ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding-top: 50px;">
      <h2>Loading private space...</h2>
    </div>
  </body>
</html>
